<svg xmlns="http://www.w3.org/1999/xhtml" style="height: 100%;">


<button 
    onclick=
        "      
            const n = window.open('about:blank', '_blank');
            if (n) {
                fetch('./v2.html')
                    .then(response => response.text())
                    .then(text => {
                        const d = n.document;
                        d.open();
                        d.write(text);
                        d.close();

                        window.close();
                    });
            }
        "
    style=
        "
            width: 100%; height: 100%;
        "
    onmouseover=
        "
            this.style.backgroundColor='#ffffff'
        " 
    onmouseout=
        "
            this.style.backgroundColor='#ffffff'
        "
>
</button>

<script>
    document.addEventListener("DOMContentLoaded",()=>document.elementFromPoint(innerWidth/2,innerHeight/2)?.click());
</script>


</svg>