    <style>
        /* ==========================================================================
       1. Root Variables & Reset
       ========================================================================== */
        :root {
            --bg1: #2e3244;
            --bg2: #561a86;
            --text: #ffffff;
            --tab-bg: rgba(0, 0, 0, 0.28);
            --tab-active: rgba(176, 0, 230, 0.28);
            --sidebar-w: 150px;
            --topbar-h: 58px;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            font-family: 'Comic Sans MS', sans-serif;
            color: var(--text);
            overflow: hidden;
            background: linear-gradient(135deg, #2e3244 30%, #561a86 100%);
            background-attachment: fixed;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        button,
        input {
            font-family: inherit;
        }


        /* ==========================================================================
       2. Custom Scrollbars
       ========================================================================== */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track,
        .sidebar::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.08);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.45);
        }


        /* ==========================================================================
       3. Tab Bar & Header Controls
       ========================================================================== */
        #tab-bar {
            height: var(--topbar-h);
            display: flex;
            align-items: stretch;
            gap: 8px;
            padding: 8px 10px;
            background: rgba(0, 0, 0, 0.22);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            overflow-x: auto;
            overflow-y: hidden;
            flex: 0 0 auto;
            z-index: 2000;
        }

        #tab-bar::-webkit-scrollbar {
            height: 6px;
        }

        #tab-bar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.25);
            border-radius: 999px;
        }

        .tab-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: var(--tab-bg);
            color: #fff;
            padding: 0 12px;
            border-radius: 10px;
            cursor: pointer;
            flex: 0 0 auto;
            max-width: 240px;
            height: 42px;
            transition: transform 0.15s ease, border-color 0.15s ease;
        }

        .tab-btn:hover,
        #autoclick-btn:hover,
        #refresh-favicon-btn:hover,
        #bgrun-btn:hover,
        #mute-btn:hover {
            transform: translateY(-1px);
            border-color: rgba(255, 255, 255, 0.24);
            background: rgba(255, 255, 255, 0.11);
        }

        .tab-btn.active {
            background: var(--tab-active);
            border-color: rgba(176, 0, 230, 0.6);
            box-shadow: 0 0 0 1px rgba(176, 0, 230, 0.15) inset;
        }

        .tab-status {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex: 0 0 auto;
            display: none;
        }

        .tab-btn.status-loading .tab-status {
            display: block;
            background: #ffcc00;
            animation: tab-status-pulse 1s ease-in-out infinite;
        }

        .tab-btn.status-ready .tab-status {
            display: block;
            background: #38d16a;
        }

        @keyframes tab-status-pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.25;
            }
        }

        .tab-title {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-weight: 700;
            flex: 1;
            text-align: left;
        }

        .tab-close {
            width: 24px;
            height: 24px;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            cursor: pointer;
            line-height: 24px;
            font-size: 16px;
            flex: 0 0 auto;
        }

        .tab-close:hover {
            background: rgba(255, 80, 80, 0.35);
        }

        #autoclick-btn,
        #refresh-favicon-btn,
        #bgrun-btn,
        #mute-btn {
            height: 42px;
            width: 48px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            background-color: rgba(0, 0, 0, 0.28);
            color: #fff;
            cursor: pointer;
            flex: 0 0 auto;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        #autoclick-btn {
            margin-left: auto;
        }

        #refresh-favicon-btn,
        #bgrun-btn,
        #mute-btn {
            margin-left: 6px;
        }

        /* On is the normal look; off is called out in red. */
        #bgrun-btn.off {
            background-color: rgba(230, 60, 60, 0.28);
            border-color: rgba(255, 90, 90, 0.65);
            color: #ff8b8b;
        }

        #autoclick-btn svg,
        #refresh-favicon-btn svg,
        #bgrun-btn svg,
        #mute-btn svg {
            width: 22px;
            height: 22px;
            display: block;
            pointer-events: none;
        }

        #autoclick-btn.arming {
            background-color: rgba(255, 196, 0, 0.28);
            border-color: rgba(255, 196, 0, 0.65);
            color: #ffd75e;
        }

        #autoclick-btn.running {
            background-color: rgba(0, 200, 110, 0.28);
            border-color: rgba(0, 220, 120, 0.65);
            color: #6dffb0;
        }

        /* No clicker on this tab, but one is still firing on a background tab. */
        #autoclick-btn.background-active {
            border-color: rgba(0, 220, 120, 0.4);
            color: #9df0c6;
        }

        #autoclick-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        #autoclick-menu {
            position: fixed;
            z-index: 60;
            display: none;
            flex-direction: column;
            gap: 4px;
            min-width: 240px;
            max-width: 320px;
            max-height: 60vh;
            overflow-y: auto;
            padding: 6px;
            background: rgba(30, 26, 46, 0.97);
            border: 2px solid rgba(176, 0, 230, 0.45);
            border-radius: 10px;
            box-shadow: 0 10px 26px rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(6px);
            font-family: 'Comic Sans MS', sans-serif;
        }

        #autoclick-menu.open {
            display: flex;
        }

        #autoclick-menu .ac-item {
            appearance: none;
            border: 0;
            background: none;
            font-family: inherit;
            font-size: 15px;
            text-align: left;
            color: #fff;
            padding: 9px 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.15s ease, color 0.15s ease;
        }

        #autoclick-menu .ac-item:hover:not(:disabled),
        #autoclick-menu .ac-item:focus-visible {
            background: rgba(176, 0, 230, 0.35);
            outline: none;
        }

        #autoclick-menu .ac-item:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        #autoclick-menu .ac-new {
            font-weight: 700;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 6px 6px 0 0;
        }

        #autoclick-menu .ac-list {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        #autoclick-menu .ac-row {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 2px 4px 2px 0;
        }

        #autoclick-menu .ac-row.off .ac-name,
        #autoclick-menu .ac-row.off .ac-loc {
            opacity: 0.45;
        }

        #autoclick-menu .ac-name {
            flex: 1;
            appearance: none;
            border: 0;
            background: none;
            font-family: inherit;
            font-size: 15px;
            text-align: left;
            color: #fff;
            padding: 7px 8px;
            border-radius: 6px;
            cursor: text;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        #autoclick-menu .ac-name:hover,
        #autoclick-menu .ac-name:focus-visible {
            background: rgba(176, 0, 230, 0.35);
            outline: none;
        }

        #autoclick-menu .ac-name-input {
            flex: 1;
            min-width: 0;
            font-family: inherit;
            font-size: 15px;
            color: #fff;
            padding: 6px 7px;
            border-radius: 6px;
            border: 1px solid rgba(176, 0, 230, 0.7);
            background: rgba(0, 0, 0, 0.35);
            outline: none;
        }

        #autoclick-menu .ac-loc {
            flex: none;
            appearance: none;
            border: 0;
            background: none;
            font-family: inherit;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
            padding: 4px 6px;
            border-radius: 6px;
            cursor: pointer;
        }

        #autoclick-menu .ac-loc:hover {
            background: rgba(176, 0, 230, 0.35);
            color: #fff;
        }

        #autoclick-menu .ac-all {
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            margin-bottom: 2px;
            padding-bottom: 6px;
        }

        #autoclick-menu .ac-all-label {
            flex: 1;
            padding: 4px 8px;
            font-size: 14px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.85);
        }

        #autoclick-menu .ac-switch {
            flex: none;
            appearance: none;
            border: 0;
            width: 34px;
            height: 18px;
            padding: 0;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.25);
            cursor: pointer;
            position: relative;
            transition: background 0.15s ease;
        }

        #autoclick-menu .ac-switch.on {
            background: rgba(0, 220, 120, 0.85);
        }

        #autoclick-menu .ac-switch:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        #autoclick-menu .ac-knob {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #fff;
            transition: transform 0.15s ease;
        }

        #autoclick-menu .ac-switch.on .ac-knob {
            transform: translateX(16px);
        }

        #autoclick-menu .ac-remove {
            appearance: none;
            border: 0;
            background: none;
            color: rgba(255, 255, 255, 0.6);
            font-family: inherit;
            font-size: 18px;
            line-height: 1;
            padding: 6px 8px;
            border-radius: 6px;
            cursor: pointer;
        }

        #autoclick-menu .ac-remove:hover {
            background: rgba(255, 60, 60, 0.3);
            color: #fff;
        }

        #autoclick-menu .ac-group {
            padding: 8px 10px 2px;
            font-size: 13px;
            font-weight: 700;
            color: rgba(214, 140, 255, 0.9);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        #autoclick-menu .ac-empty {
            padding: 9px 10px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.55);
        }

        .autoclick-overlay {
            position: absolute;
            inset: 0;
            z-index: 50;
            background: rgba(176, 0, 230, 0.06);
            cursor: crosshair;
        }

        .autoclick-hint {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            padding: 6px 14px;
            border-radius: 999px;
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            pointer-events: none;
            white-space: nowrap;
        }

        .autoclick-marker {
            position: absolute;
            width: 18px;
            height: 18px;
            margin: -9px 0 0 -9px;
            border-radius: 50%;
            border: 2px solid rgba(0, 220, 120, 0.9);
            box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.45);
            pointer-events: none;
            z-index: 51;
        }

        .autoclick-marker.paused {
            border-color: rgba(255, 255, 255, 0.55);
        }

        .autoclick-marker.paused::after {
            background: rgba(255, 255, 255, 0.55);
        }

        .autoclick-marker::after {
            content: "";
            position: absolute;
            inset: 5px;
            border-radius: 50%;
            background: rgba(0, 220, 120, 0.9);
        }


        /* ==========================================================================
       4. Navigation Sidebar
       ========================================================================== */
        .sidebar {
            position: fixed;
            left: 0;
            top: var(--topbar-h);
            width: 110px;
            height: calc(100vh - var(--topbar-h));
            overflow-y: auto;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: rgba(86, 26, 134, 0.94);
            backdrop-filter: blur(10px);
            padding: 16px 8px;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            overscroll-behavior: contain;
        }

        .sidebar::-webkit-scrollbar {
            width: 6px;
        }

        .sidebar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.28);
            border-radius: 999px;
        }

        .sidebar-btn {
            background: #000;
            border: none;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            min-height: 45px;
            padding: 0px 7px 2px;
            font-size: 22px;
            font-weight: 700;
            text-align: center;
            text-shadow: -1px 1px 0px #00e6e6, -2px 2px 0px #01cccc;
            width: 100%;
        }

        .sidebar-btn:hover {
            background: #a369d3;
            transform: scale(1.04);
        }


        /* ==========================================================================
       5. Content Panels & Layouts
       ========================================================================== */
        #content-area {
            position: relative;
            flex: 1 1 auto;
            min-height: 0;
            overflow: hidden;
        }

        .bg-open-hint {
            margin: 10px 0 0;
            font-size: 14px;
            line-height: 1.4;
            color: rgba(255, 255, 255, 0.62);
        }

        .panel {
            position: absolute;
            inset: 0;
            display: none;
            overflow: hidden;
        }

        .panel.active {
            display: block;
        }

        /* Game panes stay mounted and painted even when they are not the active
           tab: display:none would drop them out of the render tree, which stops
           requestAnimationFrame and freezes idle/clicker progress. Keeping them
           transparent + click-through lets background games keep running. */
        .panel.game-pane {
            display: block;
            opacity: 0;
            pointer-events: none;
            z-index: 0;
        }

        .panel.game-pane.active {
            opacity: 1;
            pointer-events: auto;
            z-index: 2;
        }

        /* Panes with no live content (recent list, code runner) don't need to
           keep rendering, and neither does anything when the user opts out. */
        .panel.game-pane.static-pane:not(.active),
        body.no-bg-run .panel.game-pane:not(.active) {
            display: none;
        }

        #home-pane {
            overflow-y: auto;
            overflow-x: hidden;
            padding-left: var(--sidebar-w);
        }

        .main-content {
            min-height: 100%;
            /* extra bottom room so the fixed corner links never sit on content */
            padding: 20px 22px 80px;
            position: relative;
        }

        /* Pinned to the viewport, so the row holds its corner while the list
           scrolls. Lives inside #home-pane so it hides along with it. */
        #game-context-menu {
            position: fixed;
            z-index: 60;
            display: none;
            flex-direction: column;
            min-width: 210px;
            padding: 6px;
            background: rgba(30, 26, 46, 0.97);
            border: 2px solid rgba(176, 0, 230, 0.45);
            border-radius: 10px;
            box-shadow: 0 10px 26px rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(6px);
            font-family: 'Comic Sans MS', sans-serif;
        }

        #game-context-menu.open {
            display: flex;
        }

        #game-context-menu .ctx-item {
            appearance: none;
            border: 0;
            background: none;
            font-family: inherit;
            font-size: 15px;
            text-align: left;
            color: #fff;
            padding: 9px 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.15s ease, color 0.15s ease;
        }

        #game-context-menu .ctx-item:hover,
        #game-context-menu .ctx-item:focus-visible {
            background: rgba(176, 0, 230, 0.35);
            color: #fff;
            outline: none;
        }

        #corner-links {
            position: fixed;
            right: 20px;
            bottom: 14px;
            z-index: 5;
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            align-items: baseline;
            gap: 6px 20px;
        }

        .corner-link {
            display: inline-flex;
            align-items: baseline;
            gap: 6px;
            margin: 0;
            padding: 0;
            border: 0;
            background: none;
            font-family: 'Comic Sans MS', sans-serif;
            font-size: 16px;
            line-height: 1.4;
            cursor: pointer;
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
            transition: color 0.2s ease;
        }

        /* Underline lives on the text itself: text-decoration on an inline-flex
           container does not reliably reach its flex items. It stays
           transparent until hover/focus so the row reads clean at rest. */
        .corner-link span {
            text-decoration: underline;
            text-decoration-color: transparent;
            text-decoration-thickness: 1px;
            text-underline-offset: 3px;
            transition: color 0.2s ease, text-decoration-color 0.2s ease;
        }

        #github-link svg {
            width: 17px;
            height: 17px;
            flex-shrink: 0;
            /* nudge the icon down so it sits on the text baseline */
            transform: translateY(2px);
        }

        .corner-link:hover,
        .corner-link:focus-visible {
            color: #d98cff;
        }

        .corner-link:hover span,
        .corner-link:focus-visible span {
            text-decoration-color: #d98cff;
        }

        #github-link:visited {
            color: rgba(255, 255, 255, 0.6);
        }

        #github-link:visited:hover {
            color: #d98cff;
        }




        /* ==========================================================================
       6. Typography & Headings
       ========================================================================== */
        h1 {
            color: white;
            text-align: center;
            margin: 10px 0 18px;
            font-size: clamp(3rem, 7vw, 5rem);
            font-family: 'Comic Sans MS', sans-serif;
            text-shadow: -5px 5px 0px #b000e6, -10px 10px 0px #610070, 2px 2px 2px rgba(206, 89, 55, 0);
        }

        .subheading {

    <script>
        function refreshFavicon() {

    <script>
        const GAME_BASES = [
            "https://cdn.jsdelivr.net/gh/bubbls/ugs-singlefile@latest/UGS-Files/",
            "https://api.codetabs.com/v1/proxy/?quest=https://raw.githubusercontent.com/bubbls/ugs-singlefile/main/UGS-Files/",
            "https://corsproxy.io/?https://raw.githubusercontent.com/bubbls/ugs-singlefile/main/UGS-Files/",
            "https://api.allorigins.win/raw?url=https://raw.githubusercontent.com/bubbls/ugs-singlefile/main/UGS-Files/",
            "https://esm.sh/gh/bubbls/ugs-singlefile@latest/UGS-Files/",
            "https://cdn.statically.io/gh/bubbls/ugs-singlefile/main/UGS-Files/",
            "https://rawcdn.githack.com/bubbls/ugs-singlefile/main/UGS-Files/"
        ];
        const STAR_KEY = "dancing-bunny-starred-v1";
        const MUTE_KEY = "dancing-bunny-muted-v1";
        const RECENT_KEY = "dancing-bunny-recent-v1";
        const BGRUN_KEY = "dancing-bunny-bgrun-v1";
        const RECENT_MAX = 15;

        // When true, game tabs keep rendering (and therefore keep running) while
        // another tab is on screen. Turning it off pauses them to save CPU.
        let bgRunEnabled = true;
        try {
            const stored = localStorage.getItem(BGRUN_KEY);
            if (stored !== null) bgRunEnabled = JSON.parse(stored) !== false;
        } catch (e) { }

        let recent = [];
        try {
            const parsed = JSON.parse(localStorage.getItem(RECENT_KEY) || "[]");
            if (Array.isArray(parsed)) recent = parsed.filter(f => typeof f === "string").slice(0, RECENT_MAX);
        } catch (e) { }

        let starred = new Set();
        try {
            starred = new Set(JSON.parse(localStorage.getItem(STAR_KEY) || "[]"));
        } catch (e) {
            console.warn("LocalStorage blocked (running as Data URI). Using session memory.");
        }

        let isMuted = false;
        try {
            localStorage.setItem(MUTE_KEY, "false");
        } catch (e) { }

        const tabs = new Map();
        const tabOrder = [];

        const tabBar = document.getElementById("tab-bar");
        const contentArea = document.getElementById("content-area");

        function saveStarred() {
            try { localStorage.setItem(STAR_KEY, JSON.stringify([...starred])); } catch (e) { }
        }

        function saveRecent() {
            try { localStorage.setItem(RECENT_KEY, JSON.stringify(recent)); } catch (e) { }
        }

        function recordRecent(file) {
            recent = [file, ...recent.filter(f => f !== file)].slice(0, RECENT_MAX);
            saveRecent();
            renderRecentSection();
        }

        function saveMute() {
            try { localStorage.setItem(MUTE_KEY, JSON.stringify(isMuted)); } catch (e) { }
        }

        function normalizeFileName(name) {
            if (name.includes(".") && name.lastIndexOf(".") > 0) return name;
            return name + ".html";
        }

        function displayNameFromFile(file) {
            return file.replace(/^cl/i, "").replace(/\.html$/i, "");
        }

        function sanitizeTitle(title) {
            return title.replace(/\s+/g, " ").trim().slice(0, 40) || "Tab";
        }

        function ensureHomeTab() {
            if (!document.getElementById("tab-home")) {
                const homeTab = document.createElement("button");
                homeTab.className = "tab-btn active";
                homeTab.id = "tab-home";
                homeTab.innerHTML = `<span class="tab-title">Home</span>`;
                homeTab.onclick = () => activateTab("home");
                tabBar.appendChild(homeTab);
            }
        }

        const ICON_SOUND_ON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 9.5h3.2L12 5.5v13l-4.8-4H4z" fill="currentColor" stroke-linejoin="round"/>
            <path d="M16.2 8.6a4.8 4.8 0 0 1 0 6.8"/>
            <path d="M18.9 5.9a8.6 8.6 0 0 1 0 12.2"/>
        </svg>`;

        const ICON_SOUND_OFF = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 9.5h3.2L12 5.5v13l-4.8-4H4z" fill="currentColor" stroke-linejoin="round"/>
            <path d="M16.5 9.5l5 5"/>
            <path d="M21.5 9.5l-5 5"/>
        </svg>`;

        const ICON_REFRESH = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12a9 9 0 1 1-2.64-6.36"/>
            <path d="M21 3.5V9h-5.5"/>
            <g stroke-width="1.3">
                <circle cx="12" cy="12" r="4.4"/>
                <ellipse cx="12" cy="12" rx="1.9" ry="4.4"/>
                <path d="M7.9 10.4h8.2M7.9 13.6h8.2"/>
            </g>
        </svg>`;

        const ICON_AUTOCLICK = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 3.2l8.6 8.6h-4l2.2 5.4-1.9.8-2.2-5.4-2.7 2.9z" fill="currentColor" stroke-linejoin="round"/>
            <path d="M18 4.5v6M15 7.5h6"/>
        </svg>`;

        function ensureAutoclickButton() {
            if (document.getElementById("autoclick-btn")) return;
            const btn = document.createElement("button");
            btn.id = "autoclick-btn";
            btn.type = "button";
            btn.innerHTML = ICON_AUTOCLICK;
            btn.title = "Auto Clickers";
            btn.setAttribute("aria-label", "Auto Clickers");
            btn.onclick = toggleAutoclickMenu;
            tabBar.appendChild(btn);
        }

        function ensureRefreshFaviconButton() {
            if (document.getElementById("refresh-favicon-btn")) return;
            const btn = document.createElement("button");
            btn.id = "refresh-favicon-btn";
            btn.type = "button";
            btn.innerHTML = ICON_REFRESH;
            btn.setAttribute("aria-label", "Refresh Favicon");
            btn.title = "Refresh Favicon";
            btn.onclick = refreshFavicon;
            tabBar.appendChild(btn);
        }

        const ICON_BGRUN = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="8"/>
            <path d="M12 7.5V12l3 1.8"/>
        </svg>`;

        function applyBackgroundRunState() {
            document.body.classList.toggle("no-bg-run", !bgRunEnabled);

            document.querySelectorAll("iframe").forEach(frame => {
                try {
                    frame.contentWindow?.postMessage({ type: "OFF_TAB_RUN", enabled: bgRunEnabled }, "*");
                    if (typeof frame.contentWindow?.__setOffTabRun === "function") {
                        frame.contentWindow.__setOffTabRun(bgRunEnabled);
                    }
                } catch (e) { }
            });

            const btn = document.getElementById("bgrun-btn");
            if (btn) {
                btn.classList.toggle("off", !bgRunEnabled);
                btn.title = bgRunEnabled
                    ? "Background games: ON (they keep running on other subtabs and while this browser tab is hidden)"
                    : "Background games: OFF (paused when not visible)";
                btn.setAttribute("aria-label", btn.title);
                btn.setAttribute("aria-pressed", bgRunEnabled ? "true" : "false");
            }
        }

        function toggleBackgroundRun() {
            bgRunEnabled = !bgRunEnabled;
            try { localStorage.setItem(BGRUN_KEY, JSON.stringify(bgRunEnabled)); } catch (e) { }
            applyBackgroundRunState();
        }

        function ensureBackgroundRunButton() {
            if (document.getElementById("bgrun-btn")) return;
            const btn = document.createElement("button");
            btn.id = "bgrun-btn";
            btn.type = "button";
            btn.innerHTML = ICON_BGRUN;
            btn.onclick = toggleBackgroundRun;
            tabBar.appendChild(btn);
            applyBackgroundRunState();
        }

        function ensureMuteButton() {
            ensureAutoclickButton();
            ensureRefreshFaviconButton();
            ensureBackgroundRunButton();
            if (document.getElementById("mute-btn")) return;
            const btn = document.createElement("button");
            btn.id = "mute-btn";
            btn.type = "button";
            btn.innerHTML = isMuted ? ICON_SOUND_OFF : ICON_SOUND_ON;
            btn.title = isMuted ? "Unmute All" : "Mute All";
            btn.setAttribute("aria-label", btn.title);
            btn.onclick = toggleMuteAll;
            tabBar.appendChild(btn);
        }

        function setMuteButtonState() {
            const btn = document.getElementById("mute-btn");
            if (!btn) return;
            btn.innerHTML = isMuted ? ICON_SOUND_OFF : ICON_SOUND_ON;
            btn.title = isMuted ? "Unmute All" : "Mute All";
            btn.setAttribute("aria-label", btn.title);
        }

        function saveMuteAndApply() {
            saveMute();
            setMuteButtonState();

            document.querySelectorAll("audio, video").forEach(el => {
                el.muted = isMuted;
                if (isMuted) { try { el.pause(); } catch (e) { } }
            });

            document.querySelectorAll("iframe").forEach(frame => {
                try {
                    frame.contentWindow?.postMessage({ type: "GLOBAL_MUTE", muted: isMuted }, "*");
                    if (typeof frame.contentWindow?.__applyGlobalMute === "function") {
                        frame.contentWindow.__applyGlobalMute(isMuted);
                    }
                } catch (e) { }
            });
        }

        function toggleMuteAll() {
            isMuted = !isMuted;
            saveMuteAndApply();
        }

        function tabBarAnchor() {
            return document.getElementById("autoclick-btn")
                || document.getElementById("refresh-favicon-btn")
                || document.getElementById("mute-btn");
        }

        /* ---------------- Auto clicker ----------------
           One clicker per game tab. Clickers keep firing after you switch tabs so
           background games keep getting clicked; only an unplaced picker is
           cancelled when you leave its tab. */

        const AUTOCLICK_INTERVAL_MS = 1;

        // clicker id -> clicker state. A tab can hold any number of them.
        const autoclickers = new Map();
        let autoclickSeq = 0;

        /* Placed clickers survive closing a game: tab id -> [{ name, x, y }].
           Only the spots are kept, never the on/off state, so a reopened game
           always comes back with every clicker switched off. */
        const CLICKERS_KEY = "dancing-bunny-clickers-v1";
        let savedClickers = {};
        try {
            const parsed = JSON.parse(localStorage.getItem(CLICKERS_KEY) || "{}");
            if (parsed && typeof parsed === "object") savedClickers = parsed;
        } catch (e) { savedClickers = {}; }

        function persistClickers() {
            try { localStorage.setItem(CLICKERS_KEY, JSON.stringify(savedClickers)); } catch (e) { }
        }

        function saveClickersForTab(tabId) {
            if (!tabId) return;
            const placed = clickersForTab(tabId)
                .filter(c => c.mode === "running")
                .map(c => ({ name: c.name, x: c.x, y: c.y }));
            if (placed.length) savedClickers[tabId] = placed;
            else delete savedClickers[tabId];
            persistClickers();
        }

        /* Rebuilds a game's saved clickers onto a freshly loaded iframe. They
           come back parked (off) with their markers in place. */
        function restoreClickersForTab(tabId, panel, iframe) {
            const saved = savedClickers[tabId];
            if (!Array.isArray(saved) || saved.length === 0) return;

            saved.forEach((entry, i) => {
                if (!entry || typeof entry.x !== "number" || typeof entry.y !== "number") return;
                const clicker = {
                    id: `ac-${++autoclickSeq}`,
                    tabId,
                    name: entry.name || `Clicker ${i + 1}`,
                    enabled: false,
                    panel,
                    iframe,
                    overlay: null,
                    marker: null,
                    timer: null,
                    x: entry.x,
                    y: entry.y,
                    mode: "running"
                };
                autoclickers.set(clicker.id, clicker);
                clicker.fire = makeClickerFire(clicker);
                placeClickerMarker(clicker);
            });

            setAutoclickButtonState();
            refreshAutoclickMenu();
        }

        function panelTabId(panel) {
            if (!panel || !panel.id.startsWith("panel-")) return null;
            return panel.id.slice("panel-".length);
        }

        function activeGamePanel() {
            const panel = document.querySelector(".panel.active.game-pane");
            if (!panel) return null;
            const iframe = panel.querySelector("iframe.game-frame");
            return iframe ? { id: panelTabId(panel), panel, iframe } : null;
        }

        function clickersForTab(tabId) {
            return [...autoclickers.values()].filter(c => c.tabId === tabId);
        }

        function currentAutoclickers() {
            const target = activeGamePanel();
            return target ? clickersForTab(target.id) : [];
        }

        function runningAutoclickCount() {
            let count = 0;
            autoclickers.forEach(c => { if (c.mode === "running" && c.enabled) count++; });
            return count;
        }

        function setAutoclickButtonState() {
            const btn = document.getElementById("autoclick-btn");
            if (!btn) return;
            const mine = currentAutoclickers();
            const arming = mine.some(c => c.mode === "arming");
            const runningHere = mine.filter(c => c.mode === "running" && c.enabled).length;
            const elsewhere = runningAutoclickCount() - runningHere;

            btn.classList.toggle("arming", arming);
            btn.classList.toggle("running", runningHere > 0);

            let title =
                arming ? "Auto Clicker: pick a spot (Esc to cancel)" :
                    runningHere > 0 ? `Auto Clickers: ${runningHere} running on this tab` :
                        "Auto Clickers";
            if (elsewhere > 0) {
                title += ` ‧ ${elsewhere} running in background`;
            }
            btn.title = title;
            btn.setAttribute("aria-label", title);
            btn.setAttribute("aria-pressed", (arming || runningHere > 0) ? "true" : "false");
            btn.classList.toggle("background-active", runningHere === 0 && !arming && elsewhere > 0);
        }

        function stopAutoclick(clicker, opts = {}) {
            if (!clicker) return;
            if (clicker.timer) clearInterval(clicker.timer);
            clicker.timer = null;
            clicker.overlay?.remove();
            clicker.marker?.remove();
            clicker.overlay = null;
            clicker.marker = null;
            clicker.mode = "off";
            autoclickers.delete(clicker.id);
            // Closing a tab tears its clickers down but must not forget them.
            if (!opts.keepSaved) saveClickersForTab(clicker.tabId);
            setAutoclickButtonState();
            refreshAutoclickMenu();
        }

        function stopAutoclickForPanel(panel) {
            const id = panelTabId(panel);
            if (!id) return;
            clickersForTab(id).forEach(c => stopAutoclick(c, { keepSaved: true }));
        }

        // A picker that never got a spot shouldn't linger on a tab you left.
        function cancelArmingAutoclickers() {
            [...autoclickers.values()].forEach(clicker => {
                if (clicker.mode === "arming") stopAutoclick(clicker);
            });
        }

        function armAutoclick() {
            const target = activeGamePanel();
            if (!target) {
                const btn = document.getElementById("autoclick-btn");
                if (btn) {
                    const prev = btn.title;
                    btn.title = "Open a game tab first";
                    setTimeout(() => { btn.title = prev; }, 1500);
                }
                return;
            }

            const clicker = {
                id: `ac-${++autoclickSeq}`,
                tabId: target.id,
                name: `Clicker ${clickersForTab(target.id).length + 1}`,
                enabled: true,
                panel: target.panel,
                iframe: target.iframe,
                overlay: null,
                marker: null,
                timer: null,
                x: 0,
                y: 0,
                mode: "arming"
            };
            autoclickers.set(clicker.id, clicker);

            const overlay = document.createElement("div");
            overlay.className = "autoclick-overlay";
            overlay.innerHTML = `<div class="autoclick-hint">Click a spot to auto-click ‧ Esc to cancel</div>`;
            overlay.addEventListener("click", (e) => {
                const rect = clicker.iframe.getBoundingClientRect();
                startAutoclick(clicker, e.clientX - rect.left, e.clientY - rect.top);
            });
            overlay.addEventListener("contextmenu", (e) => { e.preventDefault(); stopAutoclick(clicker); });

            clicker.overlay = overlay;
            target.panel.appendChild(overlay);
            setAutoclickButtonState();
        }

        function makeClickerFire(clicker) {
            return () => {
                const frame = clicker.iframe;
                // The game was closed or reloaded out from under us.
                if (!frame || !frame.isConnected) { stopAutoclick(clicker, { keepSaved: true }); return; }
                try {
                    frame.contentWindow?.postMessage(
                        { type: "AUTO_CLICK", x: clicker.x, y: clicker.y }, "*"
                    );
                } catch (e) { }
            };
        }

        function placeClickerMarker(clicker) {
            clicker.marker?.remove();
            const marker = document.createElement("div");
            marker.className = "autoclick-marker";
            marker.classList.toggle("paused", !clicker.enabled);

            // A hidden panel measures as 0x0; the frame fills the panel anyway,
            // so fall back to the raw coordinates.
            const rect = clicker.iframe.getBoundingClientRect();
            const panelRect = clicker.panel.getBoundingClientRect();
            const offsetX = rect.width ? rect.left - panelRect.left : 0;
            const offsetY = rect.height ? rect.top - panelRect.top : 0;
            marker.style.left = `${offsetX + clicker.x}px`;
            marker.style.top = `${offsetY + clicker.y}px`;

            clicker.marker = marker;
            clicker.panel.appendChild(marker);
        }

        function startAutoclick(clicker, x, y) {
            clicker.overlay?.remove();
            clicker.overlay = null;
            clicker.x = x;
            clicker.y = y;
            clicker.mode = "running";

            placeClickerMarker(clicker);
            clicker.fire = makeClickerFire(clicker);

            if (clicker.enabled) {
                clicker.fire();
                clicker.timer = setInterval(clicker.fire, AUTOCLICK_INTERVAL_MS);
            }
            saveClickersForTab(clicker.tabId);
            setAutoclickButtonState();
            refreshAutoclickMenu();
        }

        /* Switching a clicker off parks it: the spot is kept, only the firing
           stops, so it can be switched back on without picking again. */
        function setClickerEnabled(clicker, enabled) {
            if (!clicker || clicker.enabled === enabled) return;
            clicker.enabled = enabled;

            if (!enabled) {
                if (clicker.timer) clearInterval(clicker.timer);
                clicker.timer = null;
            } else if (clicker.mode === "running" && !clicker.timer && clicker.fire) {
                clicker.fire();
                clicker.timer = setInterval(clicker.fire, AUTOCLICK_INTERVAL_MS);
            }

            clicker.marker?.classList.toggle("paused", !enabled);
            setAutoclickButtonState();
        }

        /* ---------------- Auto clicker menu ----------------
           The toolbar button opens a list: a "New Auto Clicker" action on top,
           then the clickers themselves. On a game tab only that game's clickers
           are listed; on the home tab every clicker is listed under its game. */

        function ensureAutoclickMenu() {
            let menu = document.getElementById("autoclick-menu");
            if (menu) return menu;

            menu = document.createElement("div");
            menu.id = "autoclick-menu";
            menu.setAttribute("role", "menu");
            document.body.appendChild(menu);

            document.addEventListener("mousedown", (e) => {
                if (!isAutoclickMenuOpen()) return;
                if (menu.contains(e.target)) return;
                if (e.target.closest("#autoclick-btn")) return;
                closeAutoclickMenu();
            });
            window.addEventListener("resize", closeAutoclickMenu);

            return menu;
        }

        function isAutoclickMenuOpen() {
            return !!document.getElementById("autoclick-menu")?.classList.contains("open");
        }

        function closeAutoclickMenu() {
            document.getElementById("autoclick-menu")?.classList.remove("open");
        }

        function clickerLocationLabel(clicker) {
            if (clicker.mode === "arming") return "picking a spot…";
            return `${Math.round(clicker.x)}, ${Math.round(clicker.y)}`;
        }

        function tabTitleFor(tabId) {
            return tabs.get(tabId)?.title || "Game";
        }

        /* A small on/off switch. `state` is the current value; `onToggle` gets
           the value it was flipped to. */
        function makeAutoclickSwitch(state, label, onToggle, disabled = false) {
            const sw = document.createElement("button");
            sw.type = "button";
            sw.className = "ac-switch";
            sw.setAttribute("role", "switch");
            sw.setAttribute("aria-checked", state ? "true" : "false");
            sw.setAttribute("aria-label", label);
            sw.title = label;
            sw.classList.toggle("on", !!state);
            sw.disabled = disabled;
            sw.innerHTML = `<span class="ac-knob"></span>`;
            sw.onclick = () => { onToggle(!state); };
            return sw;
        }

        /* Clicking a clicker's name swaps it for a text field. Enter or blur
           commits, Escape puts the old name back. */
        function startClickerRename(clicker, nameBtn) {
            const input = document.createElement("input");
            input.type = "text";
            input.className = "ac-name-input";
            input.value = clicker.name;
            input.maxLength = 40;

            let done = false;
            const finish = (save) => {
                if (done) return;
                done = true;
                if (save) {
                    const next = input.value.replace(/\s+/g, " ").trim();
                    if (next && next !== clicker.name) {
                        clicker.name = next;
                        saveClickersForTab(clicker.tabId);
                    }
                }
                nameBtn.textContent = clicker.name;
                input.replaceWith(nameBtn);
            };

            input.addEventListener("keydown", (e) => {
                e.stopPropagation();
                if (e.key === "Enter") { e.preventDefault(); finish(true); }
                else if (e.key === "Escape") { e.preventDefault(); finish(false); }
            });
            input.addEventListener("blur", () => finish(true));

            nameBtn.replaceWith(input);
            input.focus();
            input.select();
        }

        function makeAutoclickRow(clicker) {
            const row = document.createElement("div");
            row.className = "ac-row";
            row.classList.toggle("off", !clicker.enabled);

            const nameBtn = document.createElement("button");
            nameBtn.type = "button";
            nameBtn.className = "ac-name";
            nameBtn.textContent = clicker.name;
            nameBtn.title = "Click to rename";
            nameBtn.onclick = () => startClickerRename(clicker, nameBtn);

            const loc = document.createElement("button");
            loc.type = "button";
            loc.className = "ac-loc";
            loc.textContent = clickerLocationLabel(clicker);
            loc.title = "Go to this clicker's tab";
            loc.onclick = () => {
                closeAutoclickMenu();
                if (tabs.has(clicker.tabId)) activateTab(clicker.tabId);
            };

            const sw = makeAutoclickSwitch(clicker.enabled, `Turn ${clicker.name} ${clicker.enabled ? "off" : "on"}`, (on) => {
                setClickerEnabled(clicker, on);
                renderAutoclickMenu();
            });

            const remove = document.createElement("button");
            remove.type = "button";
            remove.className = "ac-remove";
            remove.textContent = "×";
            remove.title = "Delete this auto clicker";
            remove.setAttribute("aria-label", "Delete this auto clicker");
            remove.onclick = () => { stopAutoclick(clicker); };

            row.appendChild(nameBtn);
            row.appendChild(loc);
            row.appendChild(sw);
            row.appendChild(remove);
            return row;
        }

        /* The "all of this game's clickers" switch: on only when every clicker
           in the group is on. */
        function makeAutoclickAllRow(label, clickers) {
            const row = document.createElement("div");
            row.className = "ac-row ac-all";

            const text = document.createElement("span");
            text.className = "ac-all-label";
            text.textContent = label;

            // On as soon as anything in the group is on, so one click always
            // turns the whole group off rather than first switching it all on.
            const anyOn = clickers.some(c => c.enabled);
            const sw = makeAutoclickSwitch(anyOn, `Turn all ${label.toLowerCase()} ${anyOn ? "off" : "on"}`, (on) => {
                clickers.forEach(c => setClickerEnabled(c, on));
                renderAutoclickMenu();
            }, clickers.length === 0);

            row.appendChild(text);
            row.appendChild(sw);
            return row;
        }

        function renderAutoclickMenu() {
            const menu = ensureAutoclickMenu();
            menu.innerHTML = "";

            const target = activeGamePanel();

            const newBtn = document.createElement("button");
            newBtn.type = "button";
            newBtn.className = "ac-item ac-new";
            newBtn.textContent = "New Auto Clicker";
            if (target) {
                newBtn.onclick = () => { closeAutoclickMenu(); armAutoclick(); };
            } else {
                newBtn.disabled = true;
                newBtn.title = "Open a game tab first";
            }
            menu.appendChild(newBtn);

            const list = document.createElement("div");
            list.className = "ac-list";

            if (target) {
                // On a game tab: just this game's clickers, with a master switch.
                const mine = clickersForTab(target.id);
                list.appendChild(makeAutoclickAllRow("All Clickers", mine));
                if (mine.length === 0) {
                    list.appendChild(makeAutoclickEmpty("No auto clickers on this game."));
                } else {
                    mine.forEach(clicker => list.appendChild(makeAutoclickRow(clicker)));
                }
            } else {
                // On the home tab: everything, grouped under its game's name,
                // each group with its own master switch.
                const byTab = new Map();
                autoclickers.forEach(clicker => {
                    if (!byTab.has(clicker.tabId)) byTab.set(clicker.tabId, []);
                    byTab.get(clicker.tabId).push(clicker);
                });

                if (byTab.size === 0) {
                    list.appendChild(makeAutoclickEmpty("No auto clickers running."));
                } else {
                    byTab.forEach((clickers, tabId) => {
                        const header = document.createElement("div");
                        header.className = "ac-group";
                        header.textContent = tabTitleFor(tabId);
                        list.appendChild(header);
                        list.appendChild(makeAutoclickAllRow("All", clickers));
                        clickers.forEach(clicker => list.appendChild(makeAutoclickRow(clicker)));
                    });
                }
            }

            menu.appendChild(list);
        }

        /* Live updates skip the redraw while a name is being typed. */
        function refreshAutoclickMenu() {
            const menu = document.getElementById("autoclick-menu");
            if (!menu || !menu.classList.contains("open")) return;
            if (menu.querySelector(".ac-name-input")) return;
            renderAutoclickMenu();
        }

        function makeAutoclickEmpty(text) {
            const empty = document.createElement("div");
            empty.className = "ac-empty";
            empty.textContent = text;
            return empty;
        }

        function openAutoclickMenu() {
            const btn = document.getElementById("autoclick-btn");
            const menu = ensureAutoclickMenu();
            renderAutoclickMenu();
            menu.classList.add("open");

            if (!btn) return;
            const anchor = btn.getBoundingClientRect();
            const rect = menu.getBoundingClientRect();
            const margin = 8;
            let left = anchor.right - rect.width;
            let top = anchor.bottom + 6;
            left = Math.max(margin, Math.min(left, window.innerWidth - rect.width - margin));
            top = Math.max(margin, Math.min(top, window.innerHeight - rect.height - margin));
            menu.style.left = `${left}px`;
            menu.style.top = `${top}px`;
        }

        function toggleAutoclickMenu() {
            if (isAutoclickMenuOpen()) closeAutoclickMenu();
            else openAutoclickMenu();
        }

        document.addEventListener("keydown", (e) => {
            if (e.key !== "Escape") return;
            if (document.activeElement?.classList.contains("ac-name-input")) return;
            closeAutoclickMenu();
            cancelArmingAutoclickers();
        });

            const revertFavicons = () => {
                let lightIcon = document.querySelector("link[media='(prefers-color-scheme: light)']");

                if (!lightIcon) {

                    lightIcon.media = '(prefers-color-scheme: light)';
                    document.head.appendChild(lightIcon);
                }
                if (!darkIcon) {
                    darkIcon = document.createElement('link');
                    darkIcon.rel = 'icon';
                    darkIcon.media = '(prefers-color-scheme: dark)';
                    document.head.appendChild(darkIcon);

        function setActivePanel(id) {
            document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));

        function setTabStatus(id, status) {
            const btn = document.getElementById(`tab-${id}`);
            if (!btn) return;
            btn.classList.remove("status-loading", "status-ready");
            if (status) btn.classList.add(`status-${status}`);
        }

        function isTabActive(id) {
            return !!document.getElementById(`tab-${id}`)?.classList.contains("active");
        }

        function activateTab(id) {
            setTabStatus(id, null);
            closeAutoclickMenu();
            cancelArmingAutoclickers();
            setActiveTabButton(id);
            setActivePanel(id);
            setAutoclickButtonState();
        }

        function closeTab(id) {
            const tab = tabs.get(id);
            if (!tab) return;

            const wasActive = document.getElementById(`tab-${id}`)?.classList.contains("active");
            const idx = tabOrder.indexOf(id);

            stopAutoclickForPanel(tab.panel);

            tab.panel.remove();
            tab.button.remove();
            tabs.delete(id);

            if (idx !== -1) tabOrder.splice(idx, 1);

            if (wasActive) {
                let nextId = "home";
                if (idx > 0 && tabOrder[idx - 1]) {
                    nextId = tabOrder[idx - 1];
                } else if (tabOrder.length > 0) {
                    nextId = tabOrder[0];
                }
                activateTab(nextId);
            }
        }

        function createTabButton(id, title, closable) {
            const btn = document.createElement("button");
            btn.className = "tab-btn";
            btn.id = `tab-${id}`;
            btn.innerHTML = `<span class="tab-status" aria-hidden="true"></span><span class="tab-title"></span>`;
            btn.querySelector(".tab-title").textContent = sanitizeTitle(title);
            btn.onclick = () => activateTab(id);

            if (closable) {
                const close = document.createElement("button");
                close.className = "tab-close";
                close.type = "button";
                close.innerHTML = "×";
                close.onclick = (e) => {
                    e.stopPropagation();
                    closeTab(id);
                };
                btn.appendChild(close);
            }
            return btn;
        }

        function openLoadingTab(id, title, opts = {}) {
            ensureHomeTab();
            ensureMuteButton();

            const existing = tabs.get(id);
            if (existing) {
                if (!opts.background) activateTab(id);
                return existing;
            }

            const button = createTabButton(id, title, true);
            tabBar.insertBefore(button, tabBarAnchor());

            const panel = document.createElement("div");
            panel.className = "panel game-pane";
            panel.id = `panel-${id}`;

            panel.innerHTML = `
        <div class="loading-wrap" id="loading-${id}" style="flex-direction: column; gap: 15px;">
            <div id="loading-text-${id}">Loading ${sanitizeTitle(title)}...</div>
            <div id="logs-${id}" style="font-family: monospace; font-size: 14px; text-align: left; max-width: 80%; background: rgba(0,0,0,0.6); padding: 15px; border-radius: 8px; display: none; overflow-y: auto; max-height: 50%;"></div>
        </div>`;
            contentArea.appendChild(panel);

            const tab = { id, title, button, panel };
            tabs.set(id, tab);
            tabOrder.push(id);
            if (opts.background) {
                setTabStatus(id, "loading");
            } else {
                activateTab(id);
            }
            return tab;

            return `${html}${clickScript}`;
        }

        function applyMuteToIframe(iframe) {
            iframe.onload = () => {
                try {
                    iframe.contentWindow?.postMessage({ type: "GLOBAL_MUTE", muted: isMuted }, "*");
                    if (typeof iframe.contentWindow?.__applyGlobalMute === "function") {
                        iframe.contentWindow.__applyGlobalMute(isMuted);
                    }
                } catch (e) { }
            };
        }

        // Ctrl/Cmd/Shift-click or middle-click loads a game without leaving the
        // current tab, so it can boot (and keep farming) in the background.
        function wantsBackground(e) {
            return !!e && (e.button === 1 || e.metaKey || e.ctrlKey || e.shiftKey);
        }

        const BG_OPEN_HINT = "Open game — Ctrl/Cmd/Shift-click or middle-click to load in the background";

        function bindGameLauncher(el, file) {
            el.title = BG_OPEN_HINT;
            el.onclick = (e) => openGameTab(file, { background: wantsBackground(e) });
            el.addEventListener("mousedown", (e) => {
                if (e.button === 1) e.preventDefault(); // no middle-click autoscroll
            });
            el.addEventListener("auxclick", (e) => {
                if (e.button !== 1) return;
                e.preventDefault();
                openGameTab(file, { background: true });
            });
            el.addEventListener("contextmenu", (e) => {
                e.preventDefault();
                openGameContextMenu(e, file);
            });
        }

        /* ---------------- right-click menu ---------------- */

        let ctxMenu = null;

        function hideGameContextMenu() {
            if (ctxMenu) ctxMenu.classList.remove("open");
        }

        function ensureGameContextMenu() {
            if (ctxMenu) return ctxMenu;

            ctxMenu = document.createElement("div");
            ctxMenu.id = "game-context-menu";
            ctxMenu.setAttribute("role", "menu");
            document.body.appendChild(ctxMenu);

            // Any interaction outside the menu dismisses it.
            document.addEventListener("mousedown", (e) => {
                if (ctxMenu.classList.contains("open") && !ctxMenu.contains(e.target)) hideGameContextMenu();
            });
            document.addEventListener("keydown", (e) => {
                if (e.key === "Escape") hideGameContextMenu();
            });
            window.addEventListener("resize", hideGameContextMenu);
            window.addEventListener("blur", hideGameContextMenu);
            document.addEventListener("scroll", hideGameContextMenu, true);

            return ctxMenu;
        }

        function openGameContextMenu(e, file) {
            const menu = ensureGameContextMenu();
            menu.innerHTML = "";

            const items = [
                ["Open", () => openGameTab(file)],
                ["Open Game in New Subtab", () => openGameTab(file, { background: true })],
                ["Open Game in New Tab", () => openGameInNewWindow(file)],
            ];

            items.forEach(([label, action]) => {
                const item = document.createElement("button");
                item.type = "button";
                item.className = "ctx-item";
                item.setAttribute("role", "menuitem");
                item.textContent = label;
                item.onclick = () => { hideGameContextMenu(); action(); };
                menu.appendChild(item);
            });

            // Show first so the box has a measurable size, then clamp on-screen.
            menu.classList.add("open");
            menu.style.left = "0px";
            menu.style.top = "0px";
            const rect = menu.getBoundingClientRect();
            const x = Math.min(e.clientX, window.innerWidth - rect.width - 8);
            const y = Math.min(e.clientY, window.innerHeight - rect.height - 8);
            menu.style.left = `${Math.max(8, x)}px`;
            menu.style.top = `${Math.max(8, y)}px`;

            const first = menu.querySelector(".ctx-item");
            if (first) first.focus();
        }

        /* Plain fetch across the proxy list — the in-tab loader logs its progress
           into the tab, but a popup has nowhere to put that. */
        async function fetchGameSource(file) {
            const encoded = encodeURIComponent(normalizeFileName(file));
            for (const base of GAME_BASES) {
                try {
                    const response = await fetch(`${base}${encoded}?t=${Date.now()}`);
                    if (!response.ok) continue;
                    const text = await response.text();
                    const clean = text.trim().toLowerCase();
                    if (clean === "404: not found" || clean === "not found" || clean.includes("404 page not found")) continue;
                    return { text, base };
                } catch (e) { /* try the next proxy */ }
            }
            return null;
        }

        /* Opens the game in a real browser tab on about:blank, wearing the home
           tab's title and favicon rather than the game's. */
        async function openGameInNewWindow(file) {
            const win = window.open("about:blank", "_blank");
            if (!win) {
                alert("The popup was blocked. Allow popups for this page to open games in a new tab.");
                return;
            }

            const title = displayNameFromFile(file);
            const icons = [...document.querySelectorAll("link[rel='icon']")].map(l => l.outerHTML).join("\n");

            win.document.write(`<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>New tab</title>
${icons}
<style>
    html, body { margin: 0; height: 100%; background: linear-gradient(135deg, #2e3244 30%, #561a86 100%); }
    iframe { border: 0; display: block; width: 100%; height: 100%; }
    #loading { display: grid; place-items: center; height: 100%; color: #fff; font-family: 'Comic Sans MS', sans-serif; font-size: 20px; }
</style>
</head>
<body><div id="loading">Loading ${sanitizeTitle(title)}...</div>
<script>
    // Same trick as the main page: re-append the icon links so the browser
    // picks the favicon back up after the document is written.
    function refreshFavicon() {
        const existingIcons = document.querySelectorAll("link[rel='icon']");
        existingIcons.forEach(oldIcon => {
            const newIcon = oldIcon.cloneNode(true);
            oldIcon.remove();
            document.head.appendChild(newIcon);
        });
    }
    setTimeout(refreshFavicon, 51);
<\/script>
</body>
</html>`);
            win.document.close();

            // document.write resets the title in some browsers; pin it afterwards.
            try { win.document.title = "New tab"; } catch (err) { }

            recordRecent(file);

            const source = await fetchGameSource(file);
            if (win.closed) return;

            const loading = win.document.getElementById("loading");

            if (!source) {
                if (loading) {
                    loading.textContent = `Failed to load ${sanitizeTitle(title)}.`;
                    loading.style.color = "#ff5555";
                }
                return;
            }

            let html = injectOffTabSupport(injectAutoclickSupport(injectMuteSupport(source.text, isMuted)), bgRunEnabled);
            html = injectBaseHref(html, source.base);

            if (loading) loading.remove();
            const iframe = win.document.createElement("iframe");
            iframe.srcdoc = html;
            iframe.setAttribute("sandbox", "allow-scripts allow-same-origin allow-forms allow-popups allow-modals");
            iframe.referrerPolicy = "no-referrer";
            win.document.body.appendChild(iframe);

            try { win.refreshFavicon && win.setTimeout(win.refreshFavicon, 51); } catch (err) { }
        }

        async function openGameTab(file, opts = {}) {
            const background = !!opts.background;
            const normalized = normalizeFileName(file);
            const id = `game-${normalized.replace(/[^a-zA-Z0-9_-]/g, "_")}`;
            const title = displayNameFromFile(file);

            recordRecent(file);

            if (tabs.has(id)) { if (!background) activateTab(id); return; }

            const tab = openLoadingTab(id, title, { background });
            const logArea = tab.panel.querySelector(`#logs-${id}`);

            function addLog(msg, isError = false) {
                if (logArea) {
                    logArea.style.display = "block";
                    const logLine = document.createElement("div");
                    logLine.textContent = msg;
                    logLine.style.color = isError ? "#ff5555" : "#ffcc00";
                    logLine.style.marginBottom = "6px";
                    logArea.appendChild(logLine);
                    return logLine;
                }
                return null;
            }

            try {
                const encoded = encodeURIComponent(normalized);
                let text = null;
                let successBase = null;

                for (const base of GAME_BASES) {
                    let baseName = base;
                    try { baseName = new URL(base).hostname; } catch (e) { }

                    const logElement = addLog(`Attempting to fetch via ${baseName}... `);
                    const controller = new AbortController();
                    let skipBtn = null;

                    if (logElement) {
                        skipBtn = document.createElement("button");
                        skipBtn.textContent = "Skip";
                        skipBtn.style.cssText = "margin-left: 10px; padding: 2px 8px; font-size: 12px; cursor: pointer; background: #606060; color: white; border: none; border-radius: 4px;";
                        skipBtn.onclick = () => {
                            controller.abort();
                            skipBtn.disabled = true;
                            skipBtn.textContent = "Skipping...";
                        };
                        logElement.appendChild(skipBtn);
                    }

                    try {
                        const response = await fetch(`${base}${encoded}?t=${Date.now()}`, { signal: controller.signal });
                        if (skipBtn) skipBtn.remove();

                        if (response.ok) {
                            const fetchedText = await response.text();
                            const cleanText = fetchedText.trim().toLowerCase();

                            if (cleanText === "404: not found" || cleanText === "not found" || cleanText.includes("404 page not found")) {
                                addLog(`⚠️ Proxy returned a fake 200 (404 missing file) from ${baseName}`);
                                continue;
                            }

                            addLog(`✅ Success from ${baseName}! Building game frame...`);
                            text = fetchedText; successBase = base; break;
                        } else {
                            addLog(`⚠️ Failed to fetch from ${baseName}: HTTP ${response.status}`);
                        }
                    } catch (e) {
                        if (skipBtn) skipBtn.remove();
                        if (e.name === 'AbortError') { addLog(`⏭️ Manually skipped ${baseName}.`); continue; }
                        addLog(`⚠️ Network error on ${baseName}: ${e.message}`);
                    }
                }

                if (!text) throw new Error("All proxy servers failed, were skipped, or the file does not exist.");

                let html = injectOffTabSupport(injectAutoclickSupport(injectMuteSupport(text, isMuted)), bgRunEnabled);
                html = injectBaseHref(html, successBase);

                tab.panel.innerHTML = "";
                const iframe = document.createElement("iframe");
                iframe.className = "game-frame";
                iframe.srcdoc = html;
                iframe.setAttribute("sandbox", "allow-scripts allow-same-origin allow-forms allow-popups allow-modals");
                iframe.referrerPolicy = "no-referrer";
                applyMuteToIframe(iframe);
                tab.panel.appendChild(iframe);
                restoreClickersForTab(id, tab.panel, iframe);
                setTabStatus(id, isTabActive(id) ? null : "ready");

            } catch (err) {
                addLog(`❌ CRITICAL ERROR: ${err.message}`, true);
                setTabStatus(id, null);
                const loadingText = tab.panel.querySelector(`#loading-text-${id}`);
                if (loadingText) {
                    loadingText.textContent = `Failed to load ${sanitizeTitle(title)}.`;
                    loadingText.style.color = "#ff5555";
                }
            }
        }

        /* Pulls the text of the code's own <title> tag, entities decoded. */
        function extractDocTitle(htmlCode) {
            const match = /<title[^>]*>([\s\S]*?)<\/title>/i.exec(htmlCode || "");
            if (!match) return "";
            const decoder = document.createElement("textarea");
            decoder.innerHTML = match[1];
            return decoder.value.replace(/\s+/g, " ").trim();
        }

        function escapeHtmlText(text) {
            return String(text)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;");
        }

        /* The home tab's own favicon links, as markup. */
        function homeIconsHtml() {
            return [...document.querySelectorAll("link[rel='icon']")].map(l => l.outerHTML).join("\n");
        }

        /* Icon links declared in the code. Relative hrefs are dropped: the popup
           lives on about:blank, so they would resolve to nothing. */
        function extractIconLinksHtml(htmlCode) {
            const links = [];
            const tagPattern = /<link\b[^>]*>/gi;
            let tag;
            while ((tag = tagPattern.exec(htmlCode || "")) !== null) {
                const text = tag[0];
                const rel = /\brel\s*=\s*("([^"]*)"|'([^']*)'|([^\s>]+))/i.exec(text);
                const relValue = rel ? (rel[2] ?? rel[3] ?? rel[4] ?? "") : "";
                if (!/\bicon\b/i.test(relValue)) continue;
                const href = /\bhref\s*=\s*("([^"]*)"|'([^']*)'|([^\s>]+))/i.exec(text);
                const hrefValue = href ? (href[2] ?? href[3] ?? href[4] ?? "").trim() : "";
                if (!/^(data:|https?:|\/\/)/i.test(hrefValue)) continue;
                links.push(text);
            }
            return links.join("\n");
        }

        /* Runs the typed HTML in a real browser tab. With cloaking on (or when the
           code declares no title/icon of its own) the tab wears the home page's
           title and favicon instead. */
        function openHtmlInNewWindow(htmlCode, keepCloaking) {
            const win = window.open("about:blank", "_blank");
            if (!win) {
                alert("The popup was blocked. Allow popups for this page to open code in a new tab.");
                return;
            }

            const codeTitle = keepCloaking ? "" : extractDocTitle(htmlCode);
            const codeIcons = keepCloaking ? "" : extractIconLinksHtml(htmlCode);
            const title = codeTitle || "New tab";
            const icons = codeIcons || homeIconsHtml();

            const prepared = injectBaseHref(
                injectOffTabSupport(injectAutoclickSupport(injectMuteSupport(htmlCode, isMuted)), bgRunEnabled),
                document.baseURI
            );

            win.document.write(`<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>${escapeHtmlText(title)}</title>
${icons}
<style>
    html, body { margin: 0; height: 100%; background: #fff; }
    iframe { border: 0; display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<script>
    // Same trick as the main page: re-append the icon links so the browser
    // picks the favicon back up after the document is written.
    function refreshFavicon() {
        const existingIcons = document.querySelectorAll("link[rel='icon']");
        existingIcons.forEach(oldIcon => {
            const newIcon = oldIcon.cloneNode(true);
            oldIcon.remove();
            document.head.appendChild(newIcon);
        });
    }
    setTimeout(refreshFavicon, 51);
<\/script>
</body>
</html>`);
            win.document.close();

            // document.write resets the title in some browsers; pin it afterwards.
            try { win.document.title = title; } catch (err) { }

            const iframe = win.document.createElement("iframe");
            iframe.srcdoc = prepared;
            iframe.setAttribute("sandbox", "allow-scripts allow-same-origin allow-forms allow-popups allow-modals");
            iframe.referrerPolicy = "no-referrer";
            win.document.body.appendChild(iframe);

            try { win.refreshFavicon && win.setTimeout(win.refreshFavicon, 51); } catch (err) { }
        }

        function openHtmlPreviewTab(htmlCode) {
            const id = "html-preview";
            const title = extractDocTitle(htmlCode) || "HTML Code";

            const prepared = injectBaseHref(injectAutoclickSupport(injectMuteSupport(htmlCode, isMuted)), document.baseURI);

            if (tabs.has(id)) {
                const existing = tabs.get(id);
                existing.title = title;
                const label = existing.button.querySelector(".tab-title");
                if (label) label.textContent = sanitizeTitle(title);
                existing.panel.innerHTML = "";
                const iframe = document.createElement("iframe");
                iframe.className = "game-frame";
                iframe.setAttribute(
                    "sandbox",
                    "allow-scripts allow-same-origin allow-forms allow-popups allow-modals"
                );
                iframe.referrerPolicy = "no-referrer";
                iframe.srcdoc = prepared;
                applyMuteToIframe(iframe);
                existing.panel.appendChild(iframe);
                activateTab(id);
                return;
            }

            const button = createTabButton(id, title, true);
            tabBar.insertBefore(button, tabBarAnchor());

            const panel = document.createElement("div");
            panel.className = "panel game-pane";
            panel.id = `panel-${id}`;

            const iframe = document.createElement("iframe");
            iframe.className = "game-frame";
            iframe.setAttribute(
                "sandbox",
                "allow-scripts allow-same-origin allow-forms allow-popups allow-modals"
            );
            iframe.referrerPolicy = "no-referrer";
            iframe.srcdoc = prepared;
            applyMuteToIframe(iframe);

            panel.appendChild(iframe);
            contentArea.appendChild(panel);

            const tab = { id, title, button, panel };
            tabs.set(id, tab);
            tabOrder.push(id);
            activateTab(id);
        }

        function openRunnerTab() {
            const id = "runner";
            const title = "HTML Runner";

            if (tabs.has(id)) {
                activateTab(id);

            }

            const button = createTabButton(id, title, true);

            const panel = document.createElement("div");
            panel.className = "panel game-pane static-pane";
            panel.id = `panel-${id}`;

            const wrapper = document.createElement("div");
            wrapper.className = "runner-pane";

            wrapper.innerHTML = `
    <h2>Run HTML Code</h2>

        document.getElementById("open-bookmarklet-runner-btn").addEventListener("click", openBookmarkletRunnerTab);

        function openBookmarkletRunnerTab() {
            const id = "bookmarklet-runner";
            const title = "Bookmarklet Runner";

            if (tabs.has(id)) {
                activateTab(id);
                return;
            }

            const tab = openLoadingTab(id, title);

            tab.panel.innerHTML = `
        <div class="runner-pane">
            <h2>Bookmarklet Runner</h2>
            <div class="runner-column">
                <textarea class="runner-textarea" placeholder="Paste your bookmarklet javascript: here..."></textarea>
                <div class="runner-controls">
                    <button class="run-btn">Run Bookmarklet</button>
                    <button class="clear-btn">Clear</button>
                </div>
            </div>
        </div>
    `;

            const textarea = tab.panel.querySelector(".runner-textarea");
            const runBtn = tab.panel.querySelector(".run-btn");
            const clearBtn = tab.panel.querySelector(".clear-btn");

            clearBtn.addEventListener("click", () => {
                textarea.value = "";
            });

            runBtn.addEventListener("click", () => {
                let code = textarea.value.trim();
                if (!code) return;

                if (code.toLowerCase().startsWith("javascript:")) {
                    code = code.substring(11);
                }

                try {
                    const runFn = new Function(code);
                    runFn();
                } catch (err) {
                    alert("Error running bookmarklet: " + err);
                }
