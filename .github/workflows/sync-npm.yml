name: Sync npm → GitHub

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Get latest npm version
        id: npm
        run: |
          VERSION=$(npm view db-gn version)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Latest db-gn version: $VERSION"

      - name: Download npm package
        run: |
          mkdir -p "$RUNNER_TEMP/npm-package"
          cd "$RUNNER_TEMP/npm-package"

          npm pack db-gn@${{ steps.npm.outputs.version }}

          tar -xzf db-gn-*.tgz --strip-components=1
          rm db-gn-*.tgz

      - name: Sync npm package to repository
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            "$RUNNER_TEMP/npm-package/" ./

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "GitHub is already synchronized with npm."
            exit 0
          fi

          git commit -m "Update ${{ steps.npm.outputs.version }}"
          git push
